{% extends 'base.html' %}
{% block content %}

<!-- 商品选择器 -->
<form method="GET" action="/wordcloud">
  <div class="selector-bar">
    <span class="selector-label">选择商品</span>
    <select name="product_name">
      <option value="" disabled {% if not selected %}selected{% endif %}>— 请选择 —</option>
      {% for p in all_products %}
      <option value="{{ p }}" {% if p == selected %}selected{% endif %}>{{ p }}</option>
      {% endfor %}
    </select>
    <button type="submit" class="btn-primary">生成词云</button>
  </div>
</form>

<div class="page-header">
  <div>
    <div class="page-title">
      <span class="page-title-accent">❋</span> 评论词云
    </div>
    <div class="page-subtitle">
      {% if selected %}{{ selected }} · 高频词汇可视化{% else %}请选择商品后生成{% endif %}
    </div>
  </div>
</div>

<div class="chart-card">
  <div class="chart-card-title">词频分布</div>

  {% if img_path %}
    <div class="wordcloud-img-wrap">
      <img src="{{ img_path }}" alt="词云图">
    </div>
  {% elif selected %}
    <!-- 如果使用 echarts-wordcloud，在这里渲染 -->
    <div id="wordcloud-chart" style="width:100%;height:520px;"></div>
  {% else %}
    <div class="empty-state">
      <div class="empty-state-icon">❋</div>
      <div class="empty-state-text">请从上方选择商品，点击「生成词云」查看结果</div>
    </div>
  {% endif %}
</div>

{% if selected and not img_path %}
<script>
const wcData = {{ wordcloud_data | tojson | default('[]') }};
const PALETTE = ['#e8823a','#5b9cf6','#3dd68c','#f5c842','#c97de0','#f06a6a','#4ecdc4'];

if (wcData.length) {
  const chart = echarts.init(document.getElementById('wordcloud-chart'));
  chart.setOption({
    backgroundColor: 'transparent',
    series: [{
      type: 'wordCloud',
      shape: 'circle',
      width: '90%',
      height: '90%',
      sizeRange: [14, 60],
      rotationRange: [-30, 30],
      rotationStep: 15,
      gridSize: 8,
      data: wcData,
      textStyle: {
        fontFamily: 'Noto Sans SC',
        fontWeight: 'normal',
        color: () => PALETTE[Math.floor(Math.random() * PALETTE.length)]
      },
      emphasis: { focus: 'none' }
    }]
  });
  window.addEventListener('resize', () => chart.resize());
}
</script>
{% endif %}

{% endblock %}
