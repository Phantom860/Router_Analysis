<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>路由器评价分析系统</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- 顶部导航栏 -->
    <header class="topbar">
        <div class="topbar-brand">
            <span class="brand-icon">◈</span>
            <span class="brand-text">ROUTER<em>INSIGHT</em></span>
        </div>
        <div class="topbar-meta">
            <span class="meta-label">数据分析平台</span>
            <span class="meta-dot"></span>
            <span class="meta-version">v1.0</span>
        </div>
    </header>

    <!-- 主体布局 -->
    <div class="layout">

        <!-- 左侧导航 -->
        <nav class="sidebar">
            <div class="sidebar-section-label">分析功能</div>
            <ul class="nav-list">
                <li class="nav-item">
                    <a href="/" class="nav-link {% if request.endpoint == 'index' %}active{% endif %}">
                        <span class="nav-icon">▤</span>
                        <span class="nav-text">商品列表</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/detail" class="nav-link {% if request.path.startswith('/detail') %}active{% endif %}">
                        <span class="nav-icon">◉</span>
                        <span class="nav-text">商品详情</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/star" class="nav-link {% if request.endpoint == 'star' %}active{% endif %}">
                        <span class="nav-icon">★</span>
                        <span class="nav-text">星级柱状图</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/wordcloud" class="nav-link {% if request.endpoint == 'wordcloud' %}active{% endif %}">
                        <span class="nav-icon">❋</span>
                        <span class="nav-text">评论词云</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/radar" class="nav-link {% if request.endpoint == 'radar' %}active{% endif %}">
                        <span class="nav-icon">⬡</span>
                        <span class="nav-text">关键词雷达图</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/cluster" class="nav-link {% if request.endpoint == 'cluster' %}active{% endif %}">
                        <span class="nav-icon">⊞</span>
                        <span class="nav-text">差评聚类</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/report" class="nav-link {% if request.endpoint == 'report' %}active{% endif %}">
                        <span class="nav-icon">🤖</span>
                        <span class="nav-text">AI分析报告</span>
                    </a>
                </li>
            </ul>

            <div class="sidebar-footer">
                <div class="sidebar-footer-line"></div>
                <span class="sidebar-footer-text">ROUTER INSIGHT</span>
            </div>
        </nav>

        <!-- 右侧内容区 -->
        <main class="content">
            {% block content %}{% endblock %}
        </main>

    </div>

    <!-- AI助手 -->
    <button id="ai-float-btn">🤖</button>

    <div id="ai-chat-panel">
        <div class="ai-header">
            AI采购助手
            <span onclick="closeChat()">✕</span>
        </div>
        <div id="chat-history"></div>
        <div class="chat-input">
            <input type="text" id="user-msg" placeholder="请输入问题...">
            <button onclick="sendMsg()">发送</button>
        </div>
    </div>

    <script>
        const btn = document.getElementById("ai-float-btn");
        const panel = document.getElementById("ai-chat-panel");

        btn.onclick = async () => {
            panel.style.display = "flex";
        }

        function closeChat() {
            panel.style.display = "none";
        }

        async function sendMsg() {
            let input = document.getElementById("user-msg");
            let msg = input.value.trim();
            if (!msg) return;

            let historyDiv = document.getElementById("chat-history");

            // 添加用户消息
            historyDiv.innerHTML += '<div class="chat-msg-user"><strong>我：</strong>' + escapeHtml(msg) + '</div>';
            input.value = "";

            // 滚动到底部
            historyDiv.scrollTop = historyDiv.scrollHeight;

            // 显示加载状态
            let loadingId = 'loading-' + Date.now();
            historyDiv.innerHTML += '<div id="' + loadingId + '" class="chat-msg-assistant"><em>✧ 思考中...</em></div>';
            historyDiv.scrollTop = historyDiv.scrollHeight;

            try {
                let resp = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        msg: msg,
                        product: getCurrentProduct()  // 可选：如果需要上下文信息，可以传当前页面标识
                    })
                });
                let data = await resp.json();

                // 移除加载状态
                let loadingEl = document.getElementById(loadingId);
                if (loadingEl) loadingEl.remove();

                // 添加AI回复
                historyDiv.innerHTML += '<div class="chat-msg-assistant"><strong>AI：</strong> ' + escapeHtml(data.answer) + '</div>';
                historyDiv.scrollTop = historyDiv.scrollHeight;

                // 可选：轻微震动提示
                let panel = document.getElementById("ai-chat-panel");
                panel.style.transform = "scale(1.01)";
                setTimeout(() => { panel.style.transform = ""; }, 100);

            } catch (err) {
                let loadingEl = document.getElementById(loadingId);
                if (loadingEl) loadingEl.remove();
                historyDiv.innerHTML += '<div class="chat-msg-assistant" style="color:#f06a6a;"><strong>AI：</strong> 请求失败，请稍后重试</div>';
                historyDiv.scrollTop = historyDiv.scrollHeight;
            }
        }

        function getCurrentProduct() {

            const params =
                new URLSearchParams(window.location.search);

            return params.get("product_name");
        }

        // HTML转义函数
        function escapeHtml(text) {
            if (!text) return "";
            let div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>

</body>
</html>
